version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'JustSamuel'
    open-pull-requests-limit: 5
    ignore:
      # Held back until typescript-eslint supports TypeScript 6.1+.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Held back until @gewis/eslint-config-typescript supports ESLint 10.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
      prod-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'JustSamuel'
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'JustSamuel'
    groups:
      github-actions:
        patterns: ['*']
