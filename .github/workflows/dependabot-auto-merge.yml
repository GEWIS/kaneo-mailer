name: Dependabot auto approve and merge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  dependabot:
    uses: GEWIS/actions/.github/workflows/dependabot-auto-merge.yml@v1
    permissions:
      actions: write
      contents: write
      pull-requests: write
    with:
      auto-approve: true
      auto-merge: true
      merge-method: 'squash'
